name: "python-sandbox"
description: "One Python call inside a sandbox session"

mode: ONCE
hostname: "sandbox"
cwd: "/home"

time_limit: 30
max_cpus: 1

keep_env: false
envar: "LANG=C.UTF-8"
envar: "HOME=/home"
envar: "PATH=/opt/sandbox/venv/bin:/usr/bin"
envar: "PYTHONDONTWRITEBYTECODE=1"
envar: "PYTHONIOENCODING=utf-8"
envar: "PYTHONUNBUFFERED=1"
envar: "MPLBACKEND=Agg"
envar: "MPLCONFIGDIR=/home/.config/matplotlib"
envar: "XDG_CACHE_HOME=/home/.cache"
envar: "OMP_NUM_THREADS=1"
envar: "OPENBLAS_NUM_THREADS=1"
envar: "MKL_NUM_THREADS=1"
envar: "NUMEXPR_NUM_THREADS=1"
envar: "VECLIB_MAXIMUM_THREADS=1"

keep_caps: false

rlimit_as_type: INF
rlimit_cpu: 60
rlimit_fsize: 100
rlimit_nofile: 128
rlimit_stack: 8

clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true
iface_no_lo: true

uidmap {
    inside_id: "65534"
    outside_id: "65534"
}

gidmap {
    inside_id: "65534"
    outside_id: "65534"
}

mount_proc: false

mount {
    src: "/etc/ld.so.cache"
    dst: "/etc/ld.so.cache"
    is_bind: true
    rw: false
}

mount {
    src: "/etc/alternatives"
    dst: "/etc/alternatives"
    is_bind: true
    rw: false
}

mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    rw: false
}

mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    rw: false
    mandatory: false
}

mount {
    src: "/usr/lib"
    dst: "/usr/lib"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/local/bin"
    dst: "/usr/local/bin"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/local/lib"
    dst: "/usr/local/lib"
    is_bind: true
    rw: false
}

mount {
    src: "/opt/sandbox/venv"
    dst: "/opt/sandbox/venv"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/bin/dot"
    dst: "/usr/bin/dot"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/bin/ffmpeg"
    dst: "/usr/bin/ffmpeg"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/bin/ffprobe"
    dst: "/usr/bin/ffprobe"
    is_bind: true
    rw: false
}

mount {
    src: "/usr/share/fonts"
    dst: "/usr/share/fonts"
    is_bind: true
    rw: false
}

mount {
    src: "/etc/fonts"
    dst: "/etc/fonts"
    is_bind: true
    rw: false
}

mount {
    src: "/var/cache/fontconfig"
    dst: "/var/cache/fontconfig"
    is_bind: true
    rw: false
}

mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    rw: true
}

mount {
    src: "/dev/urandom"
    dst: "/dev/urandom"
    is_bind: true
    rw: false
}

mount {
    dst: "/tmp"
    fstype: "tmpfs"
    rw: true
    is_bind: false
    options: "size=16m"
}

mount {
    dst: "/dev/shm"
    fstype: "tmpfs"
    rw: true
    is_bind: false
    options: "size=16m"
}

cgroup_mem_max: 268435456
cgroup_mem_swap_max: 0
cgroup_pids_max: 16
cgroup_cpu_ms_per_sec: 1000
use_cgroupv2: true

seccomp_string: "ERRNO(1) {"
seccomp_string: "  ptrace, process_vm_readv, process_vm_writev,"
seccomp_string: "  mount, umount, pivot_root, chroot, setns, unshare,"
seccomp_string: "  fsopen, fsmount, move_mount, open_tree,"
seccomp_string: "  kexec_load, init_module, finit_module, delete_module,"
seccomp_string: "  reboot, swapon, swapoff, syslog, acct, quotactl,"
seccomp_string: "  keyctl, add_key, request_key, bpf, userfaultfd, perf_event_open,"
seccomp_string: "  io_uring_setup, io_uring_enter, io_uring_register,"
seccomp_string: "  open_by_handle_at, name_to_handle_at"
seccomp_string: "}"
seccomp_string: "DEFAULT ALLOW"
