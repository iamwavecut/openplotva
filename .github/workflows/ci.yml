name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_VERSION: "1.95.0"
  CARGO_DENY_VERSION: "0.19.7"
  CARGO_AUDIT_VERSION: "0.22.1"
  CARGO_MACHETE_VERSION: "0.9.2"

permissions:
  contents: read

jobs:
  maintenance-automation:
    name: Maintenance automation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test incident automation without external credentials
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tools/maintenance/tests -v
          bash -n deploy/maintenance/install.sh
          python3 tools/maintenance/controller.py --help
          python3 tools/maintenance/preflight.py --help

      - name: Test review workflow authorization
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s .github/scripts/tests -p test_review_workflow.py -v

      - name: Test GLM review transport in the pinned PR-Agent runtime
        run: |
          docker run --rm --network none --entrypoint python \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/tmp/repository-tools \
            -v "$PWD/.github/scripts:/tmp/pr-agent-scripts:ro" \
            -v "$PWD/tools:/tmp/repository-tools:ro" \
            pragent/pr-agent@sha256:ea2ea90f072fd97708755e59827a317272f66097a1ef349eca23d39160bb0baf \
            -m unittest discover -s /tmp/pr-agent-scripts/tests -p test_glm_coding_plan.py -v

  rust-lint:
    name: Rust lint
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v5

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"

      - name: Setup reviewdog
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: reviewdog/action-setup@v1 # v1.5.0
        with:
          reviewdog_version: v0.21.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2 # v2
        with:
          shared-key: rust-${{ runner.os }}-ubuntu-22.04-${{ env.RUST_VERSION }}-lint

      - name: Review Rust formatting
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cargo fmt --all
          fmt_status=$?
          git diff -- . > rustfmt.diff
          if [[ -s rustfmt.diff ]]; then
            cat rustfmt.diff
            reviewdog \
              -name=rustfmt \
              -f=diff \
              -f.diff.strip=1 \
              -reporter=github-pr-check \
              -filter-mode=diff_context \
              -level=error \
              < rustfmt.diff || echo "reviewdog rustfmt report failed" >&2
            exit 1
          fi
          exit "$fmt_status"

      - name: Review Cargo diagnostics
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --message-format=json -- -D warnings > cargo-clippy.jsonl
          clippy_status=$?
          set -e
          jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' cargo-clippy.jsonl
          jq -n -f tools/reviewdog-cargo-diagnostics.jq cargo-clippy.jsonl > cargo-clippy.rdjson
          cat cargo-clippy.rdjson | reviewdog \
            -name=cargo-clippy \
            -f=rdjson \
            -reporter=github-pr-check \
            -filter-mode=diff_context \
            -level=warning || echo "reviewdog cargo clippy report failed" >&2
          exit "$clippy_status"

      - name: Run clippy
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-workspace:
    name: Rust workspace
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openplotva_test
          POSTGRES_PASSWORD: openplotva_test
          POSTGRES_DB: openplotva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openplotva_test -d openplotva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v5

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2 # v2
        with:
          shared-key: rust-${{ runner.os }}-ubuntu-22.04-${{ env.RUST_VERSION }}-workspace

      - name: Run fast Rust quality gate
        run: tools/rust-fast-gate.sh --skip-clippy

      - name: Run PostgreSQL integration tests serially
        env:
          OPENPLOTVA_TEST_POSTGRES_DSN: postgres://openplotva_test:openplotva_test@127.0.0.1:5432/openplotva_test
        run: |
          set -euo pipefail
          # Per-package cargo test would resolve different dependency features and rebuild most of
          # the graph, so run the test binaries the workspace build already produced.
          binaries="$(cargo test --workspace --tests --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .target.kind == ["lib"]) | "\(.target.name) \(.executable)"')"
          storage="$(awk '$1 == "openplotva_storage" {print $2}' <<<"$binaries")"
          app="$(awk '$1 == "openplotva_app" {print $2}' <<<"$binaries")"
          [[ -x "$storage" && -x "$app" ]] || { echo "storage or app test binary not found" >&2; exit 1; }
          (cd crates/openplotva-storage && "$storage" --test-threads=1 outbox_roundtrip_is_idempotent_ordered_and_fenced live_)
          (cd crates/openplotva-app && "$app" --test-threads=1 maintenance)

  rust-dependencies:
    name: Rust dependencies
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v5

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Setup reviewdog
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: reviewdog/action-setup@v1 # v1.5.0
        with:
          reviewdog_version: v0.21.0

      - name: Cache Rust dependency artifacts
        uses: Swatinem/rust-cache@v2 # v2
        with:
          shared-key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-dependencies

      - name: Cache cargo analysis tools
        uses: actions/cache@v6 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-machete
          key: cargo-tools-${{ runner.os }}-deny-${{ env.CARGO_DENY_VERSION }}-audit-${{ env.CARGO_AUDIT_VERSION }}-machete-${{ env.CARGO_MACHETE_VERSION }}

      - name: Install dependency analysis tools
        run: |
          install_tool() {
            local bin="$1"
            local crate="$2"
            local version="$3"
            if command -v "$bin" >/dev/null 2>&1 && "$bin" --version | grep -F "$version" >/dev/null 2>&1; then
              echo "${bin} ${version} restored from cache"
            else
              cargo install "$crate" --locked --version "$version"
            fi
          }

          install_tool cargo-deny cargo-deny "$CARGO_DENY_VERSION"
          install_tool cargo-audit cargo-audit "$CARGO_AUDIT_VERSION"
          install_tool cargo-machete cargo-machete "$CARGO_MACHETE_VERSION"

      - name: Review cargo deny diagnostics
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cargo deny --format sarif check > cargo-deny.sarif
          deny_status=$?
          set -e
          jq '(.runs[]?.results) |= map(select(.level == "error"))' cargo-deny.sarif > cargo-deny-errors.sarif
          if jq -e 'any(.runs[]?.results[]?; true)' cargo-deny-errors.sarif >/dev/null; then
            cat cargo-deny-errors.sarif | reviewdog \
              -name=cargo-deny \
              -f=sarif \
              -reporter=github-pr-check \
              -filter-mode=file \
              -level=warning || echo "reviewdog cargo deny report failed" >&2
          fi
          exit "$deny_status"

      - name: Dependency gate
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            tools/rust-dependency-gate.sh --skip-deny
          else
            tools/rust-dependency-gate.sh
          fi
