name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  RUST_VERSION: "1.95.0"
  CARGO_DENY_VERSION: "0.19.7"
  CARGO_AUDIT_VERSION: "0.22.1"
  CARGO_MACHETE_VERSION: "0.9.2"

permissions:
  contents: read

jobs:
  rust-workspace:
    name: Rust workspace
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v5

      - name: Cache Rust toolchain
        uses: actions/cache@v6 # v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ env.RUST_VERSION }}-workspace-v1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"

      - name: Setup reviewdog
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: reviewdog/action-setup@v1 # v1.5.0
        with:
          reviewdog_version: v0.21.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2 # v2
        with:
          shared-key: rust-${{ runner.os }}-ubuntu-22.04-${{ env.RUST_VERSION }}-workspace

      - name: Review Rust formatting
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cargo fmt --all
          fmt_status=$?
          git diff -- . > rustfmt.diff
          if [[ -s rustfmt.diff ]]; then
            cat rustfmt.diff
            reviewdog \
              -name=rustfmt \
              -f=diff \
              -f.diff.strip=1 \
              -reporter=github-pr-check \
              -filter-mode=diff_context \
              -level=error \
              < rustfmt.diff || echo "reviewdog rustfmt report failed" >&2
            exit 1
          fi
          exit "$fmt_status"

      - name: Review Cargo diagnostics
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --message-format=json -- -D warnings > cargo-clippy.jsonl
          clippy_status=$?
          set -e
          jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' cargo-clippy.jsonl
          jq -n -f tools/reviewdog-cargo-diagnostics.jq cargo-clippy.jsonl > cargo-clippy.rdjson
          cat cargo-clippy.rdjson | reviewdog \
            -name=cargo-clippy \
            -f=rdjson \
            -reporter=github-pr-check \
            -filter-mode=diff_context \
            -level=warning || echo "reviewdog cargo clippy report failed" >&2
          exit "$clippy_status"

      - name: Run fast Rust quality gate
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            tools/rust-fast-gate.sh --skip-clippy
          else
            tools/rust-fast-gate.sh
          fi

  release-candidate:
    name: Release candidate image
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ env.RUST_VERSION }}-deploy-v1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: rust-${{ runner.os }}-ubuntu-22.04-${{ env.RUST_VERSION }}-deploy

      - name: Build release binary
        run: cargo build --locked --release -p openplotva-app

      - name: Select candidate image
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}:candidate-${CANDIDATE_SHA}"
          image="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')"
          echo "OPENPLOTVA_CANDIDATE_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          target: runtime-prebuilt
          build-args: RUST_VERSION=${{ env.RUST_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ env.OPENPLOTVA_CANDIDATE_IMAGE }}
          push: true
          cache-from: type=gha,scope=openplotva-runtime-prebuilt
          cache-to: type=gha,mode=min,scope=openplotva-runtime-prebuilt

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openplotva_test
          POSTGRES_PASSWORD: openplotva_test
          POSTGRES_DB: openplotva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openplotva_test -d openplotva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OPENPLOTVA_TEST_POSTGRES_DSN: postgres://openplotva_test:openplotva_test@127.0.0.1:5432/openplotva_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v5

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2 # v2
        with:
          shared-key: rust-${{ runner.os }}-ubuntu-22.04-${{ env.RUST_VERSION }}-postgres

      - name: Run PostgreSQL storage integration tests serially
        run: |
          cargo test -p openplotva-storage outbox_roundtrip_is_idempotent_ordered_and_fenced -- --test-threads=1
          cargo test -p openplotva-storage live_ -- --test-threads=1

  rust-dependencies:
    name: Rust dependencies
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v5

      - name: Cache Rust toolchain
        uses: actions/cache@v6 # v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ env.RUST_VERSION }}-dependencies-v1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Setup reviewdog
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: reviewdog/action-setup@v1 # v1.5.0
        with:
          reviewdog_version: v0.21.0

      - name: Cache Rust dependency artifacts
        uses: Swatinem/rust-cache@v2 # v2
        with:
          shared-key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-dependencies

      - name: Cache cargo analysis tools
        uses: actions/cache@v6 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-machete
          key: cargo-tools-${{ runner.os }}-deny-${{ env.CARGO_DENY_VERSION }}-audit-${{ env.CARGO_AUDIT_VERSION }}-machete-${{ env.CARGO_MACHETE_VERSION }}

      - name: Install dependency analysis tools
        run: |
          install_tool() {
            local bin="$1"
            local crate="$2"
            local version="$3"
            if command -v "$bin" >/dev/null 2>&1 && "$bin" --version | grep -F "$version" >/dev/null 2>&1; then
              echo "${bin} ${version} restored from cache"
            else
              cargo install "$crate" --locked --version "$version"
            fi
          }

          install_tool cargo-deny cargo-deny "$CARGO_DENY_VERSION"
          install_tool cargo-audit cargo-audit "$CARGO_AUDIT_VERSION"
          install_tool cargo-machete cargo-machete "$CARGO_MACHETE_VERSION"

      - name: Review cargo deny diagnostics
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cargo deny --format sarif check > cargo-deny.sarif
          deny_status=$?
          set -e
          jq '(.runs[]?.results) |= map(select(.level == "error"))' cargo-deny.sarif > cargo-deny-errors.sarif
          if jq -e 'any(.runs[]?.results[]?; true)' cargo-deny-errors.sarif >/dev/null; then
            cat cargo-deny-errors.sarif | reviewdog \
              -name=cargo-deny \
              -f=sarif \
              -reporter=github-pr-check \
              -filter-mode=file \
              -level=warning || echo "reviewdog cargo deny report failed" >&2
          fi
          exit "$deny_status"

      - name: Dependency gate
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            tools/rust-dependency-gate.sh --skip-deny
          else
            tools/rust-dependency-gate.sh
          fi
