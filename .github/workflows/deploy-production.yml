name: Production Deploy

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.99.0"

permissions: {}

concurrency:
  group: openplotva-production
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize deployment operator
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require repository owner and main
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$ACTOR" == iamwavecut && "$TRIGGERING_ACTOR" == iamwavecut ]]
          [[ "$RELEASE_REF" == refs/heads/main ]]

  build-and-deploy:
    name: Build image and deploy
    needs: authorize
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select immutable application image
        shell: bash
        run: |
          set -euo pipefail
          echo "OPENPLOTVA_IMAGE=ghcr.io/iamwavecut/openplotva:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: rust-${{ runner.os }}-ubuntu-22.04-${{ env.RUST_VERSION }}-deploy

      - name: Build application release binary
        run: cargo build --locked --release -p openplotva-app

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push application image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          target: runtime-prebuilt
          build-args: RUST_VERSION=${{ env.RUST_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.geta-deploy.data-version=1
          tags: ${{ env.OPENPLOTVA_IMAGE }}
          push: true
          cache-from: type=gha,scope=openplotva-runtime-prebuilt
          cache-to: type=gha,mode=min,scope=openplotva-runtime-prebuilt

      - name: Wait for green CI on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started=$SECONDS
          while :; do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion // "none") \(.html_url)"')"
            elapsed=$((SECONDS - started))
            if [[ -z "$run" ]]; then
              (( elapsed < 180 )) || { echo 'No push CI found for release' >&2; exit 1; }
            else
              read -r status conclusion url <<<"$run"
              echo "CI ${status}/${conclusion}: ${url}"
              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]] && break
                echo 'CI did not pass; not deploying' >&2
                exit 1
              fi
              (( elapsed < 1800 )) || { echo 'CI timeout' >&2; exit 1; }
            fi
            sleep 20
          done

      - name: Configure pinned SSH identity
        shell: bash
        env:
          SSH_KEY: ${{ secrets.GETA_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.GETA_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.GETA_SSH_PORT || '22022' }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/geta_deploy
          chmod 600 ~/.ssh/geta_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host geta.moe\n  Port %s\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n' "$SSH_PORT" > ~/.ssh/config

      - name: Request application-only deployment
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_OPERATION: deploy
          OPENPLOTVA_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          python3 scripts/geta-deploy-request.py |
            ssh -T -i ~/.ssh/geta_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
              deploy@geta.moe "deploy $DEPLOY_SHA"

      - name: Verify broker runtime status
        run: ssh -T -i ~/.ssh/geta_deploy deploy@geta.moe status
