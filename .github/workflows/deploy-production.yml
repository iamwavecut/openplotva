name: Production Deploy

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.95.0"
  GETA_SSH_TARGET: wavecut@geta.moe
  GETA_DEPLOY_ROOT: /home/wavecut/openplotva

permissions: {}

jobs:
  authorize:
    name: Authorize deployment operator
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require repository owner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.actor }}" != "iamwavecut" || "${{ github.triggering_actor }}" != "iamwavecut" ]]; then
            echo "Production deploy can only be started or re-run by iamwavecut" >&2
            exit 1
          fi

  build-and-deploy:
    name: Reuse or build image and deploy
    needs: authorize
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v5
        with:
          fetch-depth: 0

      - name: Select GHCR image tag
        shell: bash
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY}"
          image_name="$(printf '%s' "$image_name" | tr '[:upper:]' '[:lower:]')"
          echo "OPENPLOTVA_IMAGE_NAME=$image_name" >> "$GITHUB_ENV"
          echo "OPENPLOTVA_IMAGE=${image_name}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Reuse exact-tree PR image when available
        id: release_image
        shell: bash
        run: |
          set -euo pipefail
          use_fallback() {
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "Release candidate unavailable: $1; building exact main"
            exit 0
          }

          read -r -a revision <<<"$(git rev-list --parents -n 1 "$GITHUB_SHA")"
          [[ "${#revision[@]}" == "3" ]] || use_fallback "main revision is not a two-parent merge"
          candidate_sha="${revision[2]}"
          main_tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          candidate_tree="$(git rev-parse "${candidate_sha}^{tree}")"
          [[ "$candidate_tree" == "$main_tree" ]] || use_fallback "merge tree differs from PR head"

          candidate_image="${OPENPLOTVA_IMAGE_NAME}:candidate-${candidate_sha}"
          if ! candidate_digest="$(docker buildx imagetools inspect "$candidate_image" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            use_fallback "candidate image is missing"
          fi
          candidate_digest="$(printf '%s' "$candidate_digest" | tr -d '[:space:]')"
          [[ "$candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || use_fallback "candidate digest is invalid"

          if ! docker buildx imagetools create \
            --prefer-index=false \
            --tag "$OPENPLOTVA_IMAGE" \
            "$candidate_image"; then
            use_fallback "candidate promotion failed"
          fi
          if ! published_digest="$(docker buildx imagetools inspect "$OPENPLOTVA_IMAGE" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            use_fallback "promoted image is unreadable"
          fi
          published_digest="$(printf '%s' "$published_digest" | tr -d '[:space:]')"
          [[ "$published_digest" == "$candidate_digest" ]] || use_fallback "promoted digest mismatch"
          echo "mode=reuse" >> "$GITHUB_OUTPUT"
          echo "Reused ${candidate_image} for exact main tree ${main_tree}"

      - name: Set up Docker Buildx for exact-main fallback
        if: ${{ steps.release_image.outputs.mode != 'reuse' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Cache Rust toolchain
        if: ${{ steps.release_image.outputs.mode != 'reuse' }}
        uses: actions/cache@v6 # v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ env.RUST_VERSION }}-deploy-v1

      - name: Install Rust
        if: ${{ steps.release_image.outputs.mode != 'reuse' }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Cache Rust build artifacts
        if: ${{ steps.release_image.outputs.mode != 'reuse' }}
        uses: Swatinem/rust-cache@v2 # v2
        with:
          shared-key: rust-${{ runner.os }}-ubuntu-22.04-${{ env.RUST_VERSION }}-deploy

      - name: Check Rust formatting
        if: ${{ steps.release_image.outputs.mode != 'reuse' }}
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        if: ${{ steps.release_image.outputs.mode != 'reuse' }}
        run: cargo check --workspace --all-targets --all-features

      - name: Build release binary
        if: ${{ steps.release_image.outputs.mode != 'reuse' }}
        run: cargo build --locked --release -p openplotva-app

      - name: Build and push GHCR image
        if: ${{ steps.release_image.outputs.mode != 'reuse' }}
        uses: docker/build-push-action@v7 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          target: runtime-prebuilt
          build-args: RUST_VERSION=${{ env.RUST_VERSION }}
          tags: ${{ env.OPENPLOTVA_IMAGE }}
          push: true
          cache-from: type=gha,scope=openplotva-runtime-prebuilt
          cache-to: type=gha,mode=min,scope=openplotva-runtime-prebuilt

      - name: Configure SSH
        shell: bash
        env:
          GETA_SSH_PRIVATE_KEY: ${{ secrets.GETA_SSH_PRIVATE_KEY }}
          GETA_SSH_KNOWN_HOSTS: ${{ secrets.GETA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$GETA_SSH_PRIVATE_KEY"
          test -n "$GETA_SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$GETA_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          printf '%s\n' "$GETA_SSH_PRIVATE_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Upload deploy assets
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029
          ssh "$GETA_SSH_TARGET" "install -d -m 755 '$GETA_DEPLOY_ROOT'"
          scp deploy/production/compose.production.yml "$GETA_SSH_TARGET:$GETA_DEPLOY_ROOT/compose.production.yml"
          scp deploy/production/deploy-production.sh "$GETA_SSH_TARGET:$GETA_DEPLOY_ROOT/deploy-production.sh"
          # shellcheck disable=SC2029
          ssh "$GETA_SSH_TARGET" "chmod 755 '$GETA_DEPLOY_ROOT/deploy-production.sh'"

      - name: Apply production deployment
        shell: bash
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          OPENPLOTVA_PRODUCTION_ENV_B64: ${{ secrets.OPENPLOTVA_PRODUCTION_ENV_B64 }}
        run: |
          set -euo pipefail
          test -n "$GHCR_PULL_TOKEN"
          printf -v image_q '%q' "$OPENPLOTVA_IMAGE"
          printf -v token_q '%q' "$GHCR_PULL_TOKEN"
          printf -v actor_q '%q' "$GITHUB_ACTOR"
          printf -v env_q '%q' "${OPENPLOTVA_PRODUCTION_ENV_B64:-}"
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$GETA_SSH_TARGET" \
            "OPENPLOTVA_DEPLOY_IMAGE=$image_q GHCR_USERNAME=$actor_q GHCR_PULL_TOKEN=$token_q OPENPLOTVA_PRODUCTION_ENV_B64=$env_q '$GETA_DEPLOY_ROOT/deploy-production.sh'"

      - name: Remove non-current GHCR images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo "GITHUB_TOKEN is required for post-deploy package cleanup" >&2
            exit 1
          }

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          package="${GITHUB_REPOSITORY#*/}"
          package="${package,,}"
          current_tag="${GITHUB_SHA}"
          versions_file="$(mktemp)"

          echo "Cleaning GHCR package ${owner}/${package}; keeping only current tag ${current_tag}"
          gh api --paginate --slurp "/users/${owner}/packages/container/${package}/versions?per_page=100" > "$versions_file"

          deleted=0
          while IFS= read -r version; do
            id="$(jq -r '.id' <<<"$version")"
            created_at="$(jq -r '.created_at' <<<"$version")"
            tags="$(jq -r '[.metadata.container.tags[]?] | join(",")' <<<"$version")"

            if jq -e --arg tag "$current_tag" '.metadata.container.tags // [] | index($tag)' <<<"$version" >/dev/null; then
              continue
            fi

            echo "Deleting GHCR version id=${id} created_at=${created_at} tags=${tags:-<none>}"
            gh api -X DELETE "/users/${owner}/packages/container/${package}/versions/${id}"
            deleted=$((deleted + 1))
          done < <(jq -c '.[][]' "$versions_file")

          echo "Deleted ${deleted} old GHCR package version(s)"
