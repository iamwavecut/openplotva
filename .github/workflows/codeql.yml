name: CodeQL

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "21 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-rust:
    name: CodeQL Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4 # v4
        with:
          languages: rust
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4 # v4
        with:
          category: "/language:rust"
          upload-database: false
