name: Production Backup

on:
  workflow_dispatch:

concurrency:
  group: production-backup
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    name: Back up production state
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 180
    steps:
      - name: Require repository owner and main
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$ACTOR" == iamwavecut && "$TRIGGERING_ACTOR" == iamwavecut ]]
          [[ "$RELEASE_REF" == refs/heads/main ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure pinned SSH identity
        env:
          SSH_KEY: ${{ secrets.GETA_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.GETA_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.GETA_SSH_PORT || '22022' }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/geta_deploy
          chmod 600 ~/.ssh/geta_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host geta.moe\n  Port %s\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n' "$SSH_PORT" > ~/.ssh/config
      - name: Request fixed host backup procedure
        env:
          DEPLOY_OPERATION: backup
        run: |
          set -euo pipefail
          python3 scripts/geta-deploy-request.py |
            ssh -T -i ~/.ssh/geta_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=360 \
              deploy@geta.moe backup
